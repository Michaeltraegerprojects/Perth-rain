# GitHub Pages deployment for the static site in website/.
# NOT ACTIVE: to enable, copy this file to .github/workflows/pages.yml (a deliberate human step), then set
# Settings -> Pages -> Source -> GitHub Actions. It runs on manual dispatch only: no schedule, no push trigger.
# Third-party actions are pinned to full commit SHAs (tag shown in the comment); Python packages are pinned.
name: Publish website to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read            # the check job gets read-only access; deploy rights are granted to the deploy job only

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065      # v5
        with:
          python-version: "3.12"
      - run: pip install "pandas==2.3.3" "numpy==2.5.3" "pytest==8.4.2"
      - run: python -m pytest -q website/tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020        # v4
        with:
          node-version: "22"
      - run: npm --prefix website test && npm --prefix website run check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4
      - name: Assemble site (published files only)
        run: |
          mkdir _site
          cp website/*.html _site/
          cp -r website/assets _site/assets
          mkdir -p _site/data && cp -r website/data/v1 _site/data/v1
          touch _site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b     # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e        # v4
