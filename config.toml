# Example configuration. Copy to config.toml and edit.
# Every value can also be overridden on the CLI (see README).

# ---------------------------------------------------------------- locations
# One dataset is produced per entry, written to data/<slug>/ and reports/<slug>/.
# Raw downloads are cached once in data/raw/ and shared by all locations.
# Coordinates resolved 2026-09-30 from GeoNames via the Open-Meteo Geocoding API
# (the Geoscience Australia Gazetteer WFS was returning HTTP 400/403 - see README).
# Delete entries you do not want, or use --location NAME to run just one.

[[locations]]
name = "Perth"
latitude = -31.95224
longitude = 115.8614
coordinate_source = "GeoNames 2063523 (Perth, PPLA, WA) via Open-Meteo Geocoding API, 2026-09-30"
# 009225 PERTH METRO, 3.8 km - the closest gauge with automated daily files.
id = "009225"

[[locations]]
name = "Clarkson"
latitude = -31.68282
longitude = 115.72470
coordinate_source = "GeoNames 6697150 (Clarkson, PPLL, City of Wanneroo, WA) via Open-Meteo Geocoding API, 2026-09-30"
# No gauge with automated daily files is near: the auto-selection falls back to
# GINGIN AERO / PEARCE RAAF at ~28 km. Much closer BoM gauges exist but are only
# available through Climate Data Online (manual download, see README --cdo-csv):
#   009264 TAMALA PARK (MINDARIE)  2.8 km  open since 2004
#   009105 WANNEROO                8.5 km  open since 1905
id = ""
search_radius_km = 35.0

[[locations]]
name = "Ocean Reef"
latitude = -31.75871
longitude = 115.73601
coordinate_source = "GeoNames 8349092 (Ocean Reef, PPLX, City of Joondalup, WA) via Open-Meteo Geocoding API, 2026-09-30"
# Nearest automated gauge is PERTH METRO / SWANBOURNE at ~22 km. CDO-only alternatives:
#   009214 OCEAN REEF              0.8 km  1985-2025 (closed)
#   009265 HILLARYS BOAT HARBOUR   7.4 km  open since 1991
#   009264 TAMALA PARK (MINDARIE)  5.8 km  open since 2004
id = ""
search_radius_km = 30.0

[[locations]]
name = "Fremantle"
latitude = -32.05632
longitude = 115.74557
coordinate_source = "GeoNames 2071223 (Fremantle, PPLX, City of Fremantle, WA) via Open-Meteo Geocoding API, 2026-09-30"
# Auto-selects SWANBOURNE 009215 at ~11 km. CDO-only alternative:
#   009192 FREMANTLE               1.8 km  open since 1983
id = ""

# Applies to every location unless the entry overrides it.
[location]
timezone = "Australia/Perth"

[station]
search_radius_km = 30.0
# Minimum share of days with a valid rainfall value for auto-selection.
min_completeness = 0.95
# Official BoM Climate Data Online daily rainfall CSVs (IDCJAC0009) you downloaded
# manually. They add BoM quality flags, and let you use a gauge that has no
# automated daily file. Must be for the SAME station the run uses.
cdo_csv_paths = []

[period]
# "auto" = maximum usable archive period (see archive_floor), capped at max_years.
start = "auto"
end = "auto"
# 11 years covers the full Previous Runs archive (JMA GSM from 2016-01-01).
max_years = 11
# Hard lower bound of the Open-Meteo Previous Runs API, confirmed by its own error
# message: "Parameter 'start_date' is out of allowed range from 2016-01-01".
archive_floor = "2016-01-01"
# Observations are downloaded back to this date regardless of forecast coverage, so
# the clean observation series is longer than the paired dataset. The BoM FTP product
# IDCKWCDEA0 starts at 2009-01.
observations_start = "2009-01-01"

[forecast]
lead_days = [1, 2, 3]
# Previous Runs API (fixed lead offsets, no explicit run timestamps).
# Archive starts measured at Perth on 2026-09-30:
#   jma_gsm            2016-01-01 (day3 from 2019-01-03)   <- the only long record
#   ncep_gfs_global    2024-01-19
#   ecmwf_ifs025       2024-02-03
#   bom_access_global  2024-01-19 .. 2025-07-06 only
previous_runs_models = ["jma_gsm", "ecmwf_ifs025", "ncep_gfs_global", "bom_access_global"]
# Single Runs API (explicit run initialisation time). Value = first run date to request.
single_runs = { ecmwf_ifs = "2024-03-14", ncep_gfs_global = "2026-04-02" }
# UTC hour of the run used for Single Runs lead groups (12 UTC = 20:00 AWST).
single_run_hour_utc = 12
# Conservative publication latency for global models (Open-Meteo: "typically 4-6 hours").
publication_latency_hours = 6
# A forecast is only training-eligible if it was (estimated to be) published before
# the observation window started.
require_publication_before_window = true

[qc]
# "allow_uniform_disaggregation" keeps 3 h (ECMWF 0.25) and 6 h (JMA GSM) models, whose
# hourly values are a uniform split of the native step, flagged in alignment_status.
# "strict" limits training rows to models whose native step divides the 09-09 window.
alignment_policy = "allow_uniform_disaggregation"
suspicious_daily_mm = 100.0
rain_thresholds_mm = [0.2, 1.0, 5.0]

[http]
rate_per_second = 2.0
concurrency = 3
connect_timeout_s = 20
read_timeout_s = 120
max_retries = 6
user_agent = "perthrain-dataset/0.1 (non-commercial forecast verification research)"
